<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 役員対策：検索エンジン避け -->
  <meta name="robots" content="noindex, nofollow">
  
  <title>QRコードリーダー（業務管理）</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* 共通スタイル：業務端末での視認性を重視 */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; color: #1a1a1a; margin: 0; }
    h1 { font-size: 20px; color: #2c3e50; margin-bottom: 20px; font-weight: 600; }
    
    /* スキャン画面 */
    #scan-container { max-width: 440px; margin: 0 auto; }
    #reader { width: 100%; background: #ffffff; border: 1px solid #dcdfe6; border-radius: 4px; overflow: hidden; }
    #status { margin-top: 20px; font-size: 15px; color: #606266; line-height: 1.5; }

    /* 完了・ステータス画面（初期状態は非表示） */
    #result-container { display: none; max-width: 440px; margin: 40px auto 0; padding: 30px 20px; background: #ffffff; border: 1px solid #dcdfe6; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); }
    #result-text { font-size: 16px; color: #303133; line-height: 1.6; margin-top: 20px; }
    
    /* 業務用のシンプルなステータスアイコン */
    .icon-wrapper { width: 48px; height: 48px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    
    /* 送信中スピナー */
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 完了マーク */
    .success-mark { color: #67c23a; font-size: 44px; font-weight: bold; line-height: 1; }
    /* エラーマーク */
    .error-mark { color: #f56c6c; font-size: 44px; font-weight: bold; line-height: 1; }

    /* 管理用リセットボタン */
    .btn-reset { margin-top: 30px; padding: 10px 20px; background-color: #fff; border: 1px solid #dcdfe6; border-radius: 4px; color: #606266; cursor: pointer; font-size: 14px; }
    .btn-reset:hover { background-color: #f5f7fa; color: #409eff; border-color: #c6e2ff; }

    /* メール通知エリアのデザイン */
    #email-container { max-width: 440px; margin: 30px auto 0; padding: 20px; background: #ffffff; border: 1px solid #dcdfe6; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <!-- QRコードスキャン画面 -->
  <div id="scan-container">
    <h1>QRコードスキャン</h1>
    <div id="reader"></div>
    <p id="status">カメラの枠内にQRコードをかざしてください</p>
  </div>

  <!-- スキャン結果画面 -->
  <div id="result-container">
    <div id="status-icon" class="icon-wrapper">
      <div class="spinner"></div>
    </div>
    <div id="result-text">データを送信しています...</div>
    <button class="btn-reset" onclick="location.reload();">次の読み取り（画面再読み込み）</button>
  </div>

  <!-- 打刻忘れ通知エリア -->
  <div id="email-container">
    <p style="margin-bottom: 10px; font-weight: bold; color: #2c3e50;">打刻忘れのメンバーに通知する</p>
    <p style="font-size: 12px; color: #909399; margin-bottom: 10px;">※苗字やひらがな、あだ名でも送信できます</p>
    <input type="text" id="targetInput" placeholder="例：たなか、太郎、IDなど" style="padding: 10px; font-size: 16px; width: 70%; max-width: 250px; border: 1px solid #dcdfe6; border-radius: 4px; margin-bottom: 15px;">
    <br>
    <button id="sendSpecificEmailBtn" onclick="sendSpecificReminder()" style="padding: 10px 20px; font-size: 15px; background-color: #606266; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">通知メールを送信</button>
  </div>

  <script>
    // ★重要★ GASのウェブアプリURL（QR読み取りとメール送信の両方でこのURLが使われます）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzSyruVEPh4bN5rilmItU0UIw9tfjwckgzR3-i2eHyvx7eiib_I5x7ovri612lFWNf7hQ/exec";
    
    let isProcessing = false;

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ▼ 1. QRコードを読み取った時の処理（既存の処理をそのまま保持）
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      
      if (navigator.vibrate) {
        navigator.vibrate(150);
      }

      html5QrcodeScanner.clear().then(() => {
        document.getElementById('scan-container').style.display = 'none';
        document.getElementById('email-container').style.display = 'none'; // 送信中はメール欄も隠す
        document.getElementById('result-container').style.display = 'block';
        
        const iconEl = document.getElementById('status-icon');
        const textEl = document.getElementById('result-text');
        
        iconEl.innerHTML = '<div class="spinner"></div>';
        textEl.innerHTML = `対象ID: <strong>${decodedText}</strong><br><br><span style="color: #909399;">システムへ送信中...</span>`;

        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: `id=${encodeURIComponent(decodedText)}`
        }).then(() => {
          iconEl.innerHTML = '<div class="success-mark">✓</div>';
          textEl.innerHTML = `対象ID: <strong>${decodedText}</strong><br><br><span style="color: #67c23a; font-weight: bold; font-size: 18px;">データ送信が完了しました</span>`;
        }).catch(err => {
          iconEl.innerHTML = '<div class="error-mark">✕</div>';
          textEl.innerHTML = `対象ID: <strong>${decodedText}</strong><br><br><span style="color: #f56c6c; font-weight: bold;">送信エラーが発生しました</span><br><small style="color: #909399;">${err.message}</small>`;
        });
      }).catch(err => {
        console.error("カメラ停止処理エラー:", err);
      });
    }

    // スキャナー初期化設定
    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: {width: 250, height: 250},
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
      },
      false
    );
    html5QrcodeScanner.render(onScanSuccess);

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ▼ 2. 通知メールを送信する処理（新規追加）
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function sendSpecificReminder() {
      var target = document.getElementById("targetInput").value.trim();
      if (target === "") {
        alert("通知を送りたい相手の名前（ひらがな可）を入力してください。");
        return;
      }

      var confirmSend = confirm("「" + target + "」さん宛てに通知を送信しますか？");
      if (!confirmSend) { return; }

      var btn = document.getElementById("sendSpecificEmailBtn");
      btn.innerText = "送信中...";
      btn.disabled = true;

      // メール送信処理（GASからの返答メッセージを受け取るため no-cors は使用しません）
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'action=sendSpecificReminder&target=' + encodeURIComponent(target)
      })
      .then(response => {
        if (!response.ok) {
          throw new Error("ネットワークエラー");
        }
        return response.text();
      })
      .then(result => {
        alert(result); 
        document.getElementById("targetInput").value = ""; 
        btn.innerText = "通知メールを送信";
        btn.disabled = false;
      })
      .catch(error => {
        alert("通信エラーが発生しました。アクセス権限やURLの末尾が /exec になっているか確認してください。");
        btn.innerText = "通知メールを送信";
        btn.disabled = false;
      });
    }
  </script>

</body>
</html>
