<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコードリーダー</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #status { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; transition: background-color 0.3s; border-radius: 8px; }
  </style>
</head>
<body>

  <h1>QRスキャナー</h1>
  <div id="reader"></div>
  <p id="status">カメラの許可をして、QRコードをかざしてください</p>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzSyruVEPh4bN5rilmItU0UIw9tfjwckgzR3-i2eHyvx7eiib_I5x7ovri612lFWNf7hQ/exec";
    let isProcessing = false;

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      
      isProcessing = true;
      
      // Android用バイブレーション
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }

      // 成功時に背景を緑色にする
      let statusEl = document.getElementById('status');
      statusEl.style.backgroundColor = '#d4edda'; 
      statusEl.style.padding = '15px';
      statusEl.innerText = `読み取り成功！ ID: ${decodedText}\nスプレッドシートへ送信中...`;

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: `id=${encodeURIComponent(decodedText)}`
      }).then(() => {
        statusEl.innerText = `送信完了！\n(3秒後に次を読み取れます)`;
        
        setTimeout(() => {
          isProcessing = false;
          statusEl.style.backgroundColor = 'transparent';
          statusEl.style.padding = '0px';
          statusEl.innerText = "次のQRコードをかざしてください";
        }, 3000);
      }).catch(err => {
        // エラー時は赤色にして警告する
        statusEl.style.backgroundColor = '#f8d7da'; 
        statusEl.style.padding = '15px';
        statusEl.innerText = `送信エラー: ${err.message}`;
        setTimeout(() => { 
          isProcessing = false; 
          statusEl.style.backgroundColor = 'transparent';
          statusEl.style.padding = '0px';
          statusEl.innerText = "次のQRコードをかざしてください";
        }, 3000);
      });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: {width: 250, height: 250},
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
      },
      false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>

</body>
</html>
